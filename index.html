          "isbn": "9791037516183",
          "disponibilite": "Facile à trouver.",
          "numerique": {

            "prix": "13,99",
            "format": "ePub",
            "kobo": "https://www.kobo.com/fr/fr/search?query=9791037516190"

<style>
  :root {
    --fond: #f7f3ed;
    --surface: #fffdf9;
    --texte: #29231f;
    --doux: #6f645b;
    --trait: #e7ded3;
    --accent: #a4502e;
    --solide: #2f7552;
    --nuancer: #b07a10;
    --discute: #b0442c;
    --encadre: #f1e9df;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1b1815;
      --surface: #24201c;
      --texte: #efe7dd;
      --doux: #b2a597;
      --trait: #39322b;
      --accent: #e2906a;
      --solide: #7fcba3;
      --nuancer: #e6bd5c;
      --discute: #f0907a;
      --encadre: #2c2621;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fond: #1b1815;
    --surface: #24201c;
    --texte: #efe7dd;
    --doux: #b2a597;
    --trait: #39322b;
    --accent: #e2906a;
    --solide: #7fcba3;
    --nuancer: #e6bd5c;
    --discute: #f0907a;
    --encadre: #2c2621;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  h1, h2, h3, .rang { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }

  /* En-tête */
  .surtitre { text-transform: uppercase; letter-spacing: .14em; font-size: 12.5px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
  h1 { font-size: clamp(36px, 8vw, 54px); line-height: 1.05; font-weight: 600; margin: 0 0 14px; }
  .legende { font-size: 14px; color: var(--doux); margin: 0 0 40px; }
  .legende b { font-weight: 600; }

  /* Fiabilité : un point de couleur et un mot */
  .fiab { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .fiab::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .fiab.solide { color: var(--solide); }
  .fiab.nuancer { color: var(--nuancer); }
  .fiab.discute { color: var(--discute); }

  /* Les thèmes : des volets, un seul ouvert à la fois */
  .themes { display: grid; gap: 14px; }
  details.theme {
    background: var(--surface); border: 1px solid var(--trait); border-radius: 18px;
    scroll-margin-top: 16px; transition: border-color .15s;
  }
  details.theme[open] { border-color: var(--accent); }
  details.theme > summary {
    list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr 28px;
    align-items: center; gap: 0 14px; padding: 20px 20px 20px 16px; border-radius: 18px;
  }
  details.theme > summary::-webkit-details-marker { display: none; }
  details.theme > summary:hover h2 { color: var(--accent); }
  .pastille-num {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    background: var(--encadre); color: var(--accent); font-weight: 600; font-size: 18px;
  }
  details.theme[open] .pastille-num { background: var(--accent); color: var(--surface); }
  h2 { font-size: clamp(22px, 4.5vw, 27px); line-height: 1.2; font-weight: 600; margin: 0; transition: color .15s; }
  .theme-intro { color: var(--doux); margin: 3px 0 0; font-size: 15.5px; }
  .chevron { width: 28px; height: 28px; color: var(--doux); transition: transform .2s; }
  details.theme[open] .chevron { transform: rotate(180deg); color: var(--accent); }
  .contenu { border-top: 1px solid var(--trait); padding: 0 0 6px; }

  /* Les cinq livres d'un thème */
  ol.top { list-style: none; margin: 0; padding: 0; }
  ol.top > li { display: grid; grid-template-columns: 52px 1fr; gap: 0 14px; padding: 22px 22px 20px 14px; }
  ol.top > li + li { border-top: 1px solid var(--trait); }
  .rang { font-size: 40px; line-height: 1; color: var(--accent); text-align: center; font-weight: 600; padding-top: 2px; }
  .ligne1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h3 { font-size: 21px; line-height: 1.25; font-weight: 600; margin: 0; }
  .prix { font-weight: 600; white-space: nowrap; font-size: 15.5px; }
  .auteur { color: var(--doux); font-size: 15px; margin: 2px 0 8px; }
  .en-bref { margin: 0 0 12px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 14.5px; }
  .actions .ou { color: var(--doux); }
  .actions a { color: var(--texte); font-weight: 600; text-decoration: underline; text-decoration-color: var(--trait); text-underline-offset: 3px; text-decoration-thickness: 2px; }
  .actions a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .statut { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--encadre); border-radius: 999px; padding: 1px 9px; }

  details.plus { margin-top: 12px; }
  details.plus summary { cursor: pointer; font-size: 14.5px; color: var(--doux); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details.plus summary::-webkit-details-marker { display: none; }
  details.plus summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--trait); border-radius: 50%; font-size: 13px; line-height: 1; }
  details.plus[open] summary::before { content: "−"; }
  details.plus summary:hover { color: var(--texte); }
  .fiche { margin: 12px 0 0; padding: 14px 16px; background: var(--encadre); border-radius: 12px; font-size: 15px; display: grid; gap: 8px; }
  .fiche p { margin: 0; }
  .fiche b { font-weight: 600; }
  .fiche .ref { color: var(--doux); font-size: 14px; }

  .a-savoir { margin: 4px 20px 18px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--encadre); border-radius: 0 12px 12px 0; font-size: 15px; }
  .a-savoir b { font-weight: 600; }
  .hors { border-top: 1px solid var(--trait); }
  .hors-titre { margin: 0; padding: 16px 20px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--doux); }
  ul.top { list-style: none; margin: 0; padding: 0; }
  ul.top > li { display: grid; grid-template-columns: 52px 1fr; gap: 0 14px; padding: 16px 22px 20px 14px; }
  ul.top > li + li { border-top: 1px solid var(--trait); }
  ul.top .rang { color: var(--doux); }
  @media (max-width: 560px) {
    ul.top > li { grid-template-columns: 34px 1fr; gap: 0 10px; padding: 14px 16px 16px 10px; }
    .hors-titre { padding: 14px 14px 0; }
  }


  @media (max-width: 560px) {
    body { font-size: 16px; }
    .page { padding-top: 36px; }
    details.theme > summary { grid-template-columns: 36px 1fr 24px; gap: 0 12px; padding: 16px 14px 16px 12px; }
    .pastille-num { width: 36px; height: 36px; font-size: 16px; }
    .chevron { width: 24px; height: 24px; }
    .a-savoir { margin: 4px 14px 16px; }
    ol.top > li { grid-template-columns: 34px 1fr; gap: 0 10px; padding: 18px 16px 16px 10px; }
    .rang { font-size: 30px; }
    .ligne1 { flex-direction: column; gap: 2px; }
    h3 { font-size: 19px; }
  }
  @media print {
    body { background: #fff; font-size: 11pt; }
    .actions a, .actions .ou, .chevron { display: none; }
    ol.top > li { break-inside: avoid; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <p class="surtitre">Pour bien accueillir bébé</p>
    <h1>Nos lectures</h1>
    <p class="legende">
      <span class="fiab solide">Solide</span> fondé sur la recherche ·
      <span class="fiab nuancer">À nuancer</span> utile, mais simplifié ou fondé sur l'expérience ·
      <span class="fiab discute">Discuté</span> non validé par la recherche, hors classement.
    </p>
  </header>

  <div class="themes" id="themes"></div>
</main>

<script>
(function () {
  var d = JSON.parse(document.getElementById('donnees').textContent);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var FIAB = { solide: 'Solide', nuancer: 'À nuancer', discute: 'Discuté' };
  var NIV = { accessible: 'facile à lire', approfondi: 'plus approfondi' };

  function lien(nom, url) {
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + nom + '</a>';
  }

  function ligne(l, i) {
    var q = encodeURIComponent(l.isbn || (l.titre + ' ' + l.auteurs));
    var ref = [l.format, l.editeur, l.editionAnnee, l.isbn ? 'ISBN ' + l.isbn : ''].filter(Boolean).map(esc).join(' · ');
    var statut = l.statut && l.statut !== 'à découvrir' ? '<span class="statut">' + esc(l.statut) + '</span>' : '';
    var num = l.numerique;
    var refNum = num
      ? 'Livre numérique (' + esc(num.format || 'ePub') + (num.prix ? ', ' + esc(num.prix) + ' €' : '') + ') : se lit sur Kobo' + (num.remarque ? ', ' + esc(num.remarque) : '') + '.'
      : (l.numerique === null ? 'Pas de version numérique.' : '');
    return '<li>' +
      '<div class="rang">' + (i >= 0 ? i + 1 : '·') + '</div>' +
      '<div>' +
        '<div class="ligne1"><h3>' + esc(l.titre) + '</h3>' + (l.prix ? '<span class="prix">' + esc(l.prix) + ' €</span>' : '') + '</div>' +
        '<p class="auteur">' + esc(l.auteurs) + ', ' + esc(l.annee) + '</p>' +
        '<p class="en-bref">' + esc(l.enBref) + '</p>' +
        '<div class="actions">' +
          '<span class="fiab ' + esc(l.fiabilite) + '">' + esc(FIAB[l.fiabilite] || l.fiabilite) + '</span>' + statut +
          '<span class="ou">Acheter :</span>' +
          lien('Fnac', 'https://www.fnac.com/SearchResult/ResultList.aspx?Search=' + q) +
          lien('Cultura', 'https://www.cultura.com/search/results?search_query=' + q) +
          lien('Librairie', 'https://www.placedeslibraires.fr/listeliv.php?base=allbooks&mots_recherche=' + q) +
          (num ? lien('Kobo', num.kobo || 'https://www.kobo.com/fr/fr/search?query=' + encodeURIComponent(num.isbn || (l.titre + ' ' + l.auteurs))) : '') +
        '</div>' +
        '<details class="plus"><summary>En savoir plus</summary><div class="fiche">' +
          (l.pourQui ? '<p><b>Pour qui :</b> ' + esc(l.pourQui) + (l.niveau ? ' Livre ' + esc(NIV[l.niveau] || l.niveau) + '.' : '') + '</p>' : '') +
          (l.pourquoi ? '<p><b>Ce qu\'il apporte :</b> ' + esc(l.pourquoi) + '</p>' : '') +
          (l.fiabiliteNote ? '<p><b>Fiabilité :</b> ' + esc(l.fiabiliteNote) + '</p>' : '') +
          (l.avis ? '<p><b>Notre avis :</b> ' + esc(l.avis) + '</p>' : '') +
          '<p class="ref">' + ref + (l.disponibilite ? '. ' + esc(l.disponibilite) : '') + (refNum ? ' ' + refNum : '') + '</p>' +
        '</div></details>' +
      '</div></li>';
  }

  var CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  var html = '';
  d.themes.forEach(function (t, i) {
    html += '<details class="theme" id="' + esc(t.id) + '">' +
      '<summary>' +
        '<span class="pastille-num">' + (i + 1) + '</span>' +
        '<div><h2>' + esc(t.titre) + '</h2><p class="theme-intro">' + esc(t.intro) + '</p></div>' +
        CHEVRON +
      '</summary>' +
      '<div class="contenu">' +
        '<ol class="top">' + t.livres.map(ligne).join('') + '</ol>' +
        (t.horsClassement && t.horsClassement.length
          ? '<div class="hors"><p class="hors-titre">Hors classement</p><ul class="top">' +
            t.horsClassement.map(function (l) { return ligne(l, -1); }).join('') + '</ul></div>'
          : '') +
        (t.aSavoir ? '<p class="a-savoir"><b>À savoir.</b> ' + esc(t.aSavoir) + '</p>' : '') +
      '</div></details>';
  });
  var conteneur = document.getElementById('themes');
  conteneur.innerHTML = html;

  // Un seul thème ouvert à la fois : ouvrir un thème referme les autres.
  var volets = conteneur.querySelectorAll('details.theme');
  volets.forEach(function (v) {
    v.addEventListener('toggle', function () {
      if (!v.open) return;
      volets.forEach(function (autre) { if (autre !== v) autre.open = false; });
      try { history.replaceState(null, '', '#' + v.id); } catch (e) {}
      var haut = v.getBoundingClientRect().top;
      if (haut < 0 || haut > window.innerHeight * 0.4) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  // Un lien vers « …html#lecture » ouvre directement ce thème.
  var cible = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (cible && cible.matches('details.theme')) cible.open = true;
})();

// Appli installable : garde la page en mémoire pour l'ouvrir même sans internet.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var avaitDeja = !!navigator.serviceWorker.controller, recharge = false;
  // Quand une nouvelle version de l'appli s'installe, la page se recharge une fois pour l'afficher.
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (avaitDeja && !recharge) { recharge = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {});
}
</script>
</body>
</html>
